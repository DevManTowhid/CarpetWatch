
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "carpetwatch"
version = "0.1.0"
description = "A research and distributed detection system for carpet-bombing DDoS attacks."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
ml = [
    "torch",
    "torchvision",
    "numpy",
    "pandas",
    "scikit-learn",
]

live = [
    "fastapi",
    "uvicorn[standard]",
    "redis",
]

dev = [
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"
